name: Release

on:
  release:
    types: [published]

# No long-lived PyPI token exists anywhere. The job mints a short-lived OIDC
# credential and PyPI verifies it came from this workflow, in this repository —
# so stealing a repo secret is not a way to publish Charter, because there is no
# secret to steal. Configure the trusted publisher once, at
# https://pypi.org/manage/project/charter-ai/settings/publishing/
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,langchain,mcp]"

      # Identical to ci.yml's, paths included. They had drifted: this job checked
      # four paths and not `harness`, and had no format gate at all — so a commit
      # CI rejected could still pass `verify` on all four versions and ship.
      - name: Ruff
        run: uv run ruff check src tests examples scripts harness

      - name: Ruff format
        run: uv run ruff format --check src tests examples scripts harness

      # --project . pins the config to this repository's pyproject.toml.
      # Pyright searches parent directories for a config file, so without it a
      # pyrightconfig.json above the checkout would silently replace these
      # settings — which is exactly how reportArgumentType came to be off for
      # every Charter run made inside the r28 monorepo.
      - name: Pyright
        run: uv run pyright --project . --pythonpath .venv/bin/python src

      # Same exclusion as ci.yml. Without it a release depends on Firecrawl and
      # Tavily being up and not rate-limiting, on four Python versions at once —
      # and it would fail after the GitHub Release is already published, leaving
      # a tag with no artifact on PyPI. Run them deliberately: `pytest -m live`.
      - name: Pytest
        run: uv run pytest -q -m "not live"

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      # Read off the artifact rather than pyproject: the version is derived from
      # `src/charter/__init__.py` by `[tool.hatch.version]`, so pyproject has no
      # literal to read, and the wheel's name is what actually gets uploaded.
      - name: The tag must match the version being published
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          version=$(basename "${wheels[0]}" | cut -d- -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match built version $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
