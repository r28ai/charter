# Secret scanning for Charter.
#
# The suite is offline, so every credential in tests/ is invented. That does not
# make a blanket "ignore tests/" allowlist safe: a real key pasted into a fixture
# during debugging is exactly the accident this scan exists to catch, and it
# would land in a test file. So each exemption below names one literal, and a new
# high-entropy string anywhere — tests included — still fails the scan.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # Linear's key format is `lin_api_…`, so a fixture that exercises the header
    # has to look like one. Invented, and asserted against verbatim in the pack
    # test — there is no live Linear workspace behind it.
    '''lin_api_test123''',
    # Google Calendar hands back an opaque base64 `nextPageToken`, so the
    # pagination fixture has to be one. This decodes to a reference to the
    # invented "event2" in the same file and authorises nothing.
    '''CAcSB2V2ZW50Mg''',
  ]

# The app-registration guides (docs/auth/apps/) show a client ID next to a
# screenshot of the provider's credentials page. Both are mock-ups of an invented
# "Example App" (Jane Doe, Example Inc., app.example.com), and these are the IDs
# drawn in them. Global rather than per rule because two rules match them: the
# generic one and gitleaks' own `linear-client-secret`. A client ID is not a
# secret, and the secret beside it is always written as `...`.
[allowlist]
regexTarget = "match"
regexes = [
  '''2f8d1c4e-7b3a-4e19-9c60-5d2e8a7b1f03''',
  '''3f9a1c07be52d4e8a6b0c91d27e4f538''',
]
